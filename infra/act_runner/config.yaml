# act_runner configuration for the optional Gitea Actions profile.
#
# The default runner gives every job its own Docker network, where the Gitea
# hostname does not resolve. Join the Compose network instead so checkout and
# workflow commands can reach http://gitea:3000.
log:
  level: info

runner:
  file: .runner
  capacity: 1

container:
  network: aura_default
  privileged: false
  force_pull: false

cache:
  enabled: true
