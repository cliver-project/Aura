# Alembic configuration for Aura.
#
# No sqlalchemy.url here: env.py resolves the URL from the application settings
# or from the programmatic config passed by `python -m aura.migrate`. This
# keeps secrets out of a tracked file and keeps the app and migrations on the
# same database.

[alembic]
script_location = %(here)s/src/aura/alembic
prepend_sys_path = %(here)s/src
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
